[project]
name = "sbst-llm-minimal"
version = "1.0.0"
description = "Minimal example: SBST (Pynguin) vs LLM vs hybrid, on Python code with no build step"
requires-python = ">=3.10,<3.15"
dependencies = []

[project.optional-dependencies]
dev = [
  "pynguin==0.46.0",
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  # Without this Pynguin silently ignores .env - DOTENV_AVAILABLE in
  # pynguin/utils/openai_key_resolver.py comes out False.
  "python-dotenv==1.1.1",
  # Same file, same pattern, worse ending: without pydantic it falls back to
  # SecretStr = str and then calls .get_secret_value() on it. See
  # docs/FINDINGS.md point 9.
  "pydantic==2.12.3",
  # And the client itself. llmagent.py sets OPENAI_AVAILABLE and then never
  # reads it, so without this you get NameError: name 'openai' is not defined.
  "openai==3.13.0",
]
